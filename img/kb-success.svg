<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Terminal log of an APK install verified by a system diagnostic panel, ending in a green verified badge">
<defs>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#123430"/></pattern>
<clipPath id="clip"><rect width="800" height="450"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="800" height="450" fill="#0A332C"/>
<rect width="800" height="450" fill="url(#dots)"/>
<rect width="800" height="6" fill="#00A88F"/>

<!-- terminal window -->
<rect x="28" y="32" width="470" height="326" fill="#071512" stroke="#123430"/>
<rect x="28" y="32" width="470" height="32" fill="#0E2A23"/>
<rect x="42" y="43" width="10" height="10" fill="#00A88F"/>
<rect x="58" y="43" width="10" height="10" fill="#14BFA4"/>
<rect x="74" y="43" width="10" height="10" fill="#014F44"/>
<text x="98" y="53" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="1" fill="#8FA9A2">adb · TECNO SPARK 10</text>
<text x="46" y="92" font-family="'IBM Plex Mono',monospace" font-size="14" fill="#00A88F">$</text>
<text x="60" y="92" font-family="'IBM Plex Mono',monospace" font-size="14" fill="#D9F2E8">adb install app-release.apk</text>
<text x="46" y="120" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#8FA9A2">push 41.2 MB — 100%</text>
<rect x="46" y="128" width="36" height="8" fill="#00A88F"/><rect x="86" y="128" width="36" height="8" fill="#00A88F"/><rect x="126" y="128" width="36" height="8" fill="#00A88F"/><rect x="166" y="128" width="36" height="8" fill="#00A88F"/><rect x="206" y="128" width="36" height="8" fill="#00A88F"/><rect x="246" y="128" width="36" height="8" fill="#00A88F"/><rect x="286" y="128" width="36" height="8" fill="#00A88F"/><rect x="326" y="128" width="36" height="8" fill="#014F44"/><rect x="366" y="128" width="36" height="8" fill="#014F44"/>
<text x="46" y="166" font-family="'IBM Plex Mono',monospace" font-size="13" fill="#5EEAD4">Serving... Success</text>
<text x="46" y="192" font-family="'IBM Plex Mono',monospace" font-size="12" fill="#D9F2E8">pkg: com.example.fieldtool</text>
<text x="46" y="216" font-family="'IBM Plex Mono',monospace" font-size="12" fill="#8FA9A2">signatures do match — v1/v2 ok</text>
<text x="46" y="252" font-family="'IBM Plex Mono',monospace" font-size="13" fill="#5EEAD4">▶ installed, data kept</text>
<rect x="46" y="268" width="434" height="1" fill="#123430"/>
<text x="46" y="294" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#8FA9A2">$ adb shell dumpsys package | grep status</text>
<text x="46" y="318" font-family="'IBM Plex Mono',monospace" font-size="12" fill="#D9F2E8">status=<tspan fill="#5EEAD4">ok</tspan> versionCode=12 minSdk=21</text>
<rect x="46" y="332" width="9" height="16" fill="#00A88F"/>

<!-- diagnostic panel -->
<rect x="518" y="32" width="254" height="326" fill="#0E2A23" stroke="#123430"/>
<text x="536" y="60" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="2" fill="#8FA9A2">DIAGNOSTIC</text>
<rect x="536" y="68" width="218" height="1" fill="#123430"/>
<text x="536" y="96" font-family="'IBM Plex Mono',monospace" font-size="12" fill="#D9F2E8">APK signature</text>
<text x="700" y="96" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#5EEAD4">PASS</text>
<rect x="738" y="86" width="12" height="12" fill="#00A88F"/><path d="M740.5 92 l3 3 l5.5 -6" fill="none" stroke="#071512" stroke-width="2"/>
<text x="536" y="126" font-family="'IBM Plex Mono',monospace" font-size="12" fill="#D9F2E8">Free storage</text>
<text x="700" y="126" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#5EEAD4">PASS</text>
<rect x="738" y="116" width="12" height="12" fill="#00A88F"/><path d="M740.5 122 l3 3 l5.5 -6" fill="none" stroke="#071512" stroke-width="2"/>
<text x="536" y="156" font-family="'IBM Plex Mono',monospace" font-size="12" fill="#D9F2E8">Unknown sources</text>
<text x="682" y="156" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#5EEAD4">ALLOWED</text>
<rect x="738" y="146" width="12" height="12" fill="#00A88F"/><path d="M740.5 152 l3 3 l5.5 -6" fill="none" stroke="#071512" stroke-width="2"/>
<text x="536" y="186" font-family="'IBM Plex Mono',monospace" font-size="12" fill="#D9F2E8">Battery saver</text>
<text x="700" y="186" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#5EEAD4">OFF</text>
<rect x="738" y="176" width="12" height="12" fill="#00A88F"/><path d="M740.5 182 l3 3 l5.5 -6" fill="none" stroke="#071512" stroke-width="2"/>
<rect x="536" y="204" width="218" height="1" fill="#123430"/>
<rect x="585" y="238" width="120" height="120" fill="#00A88F"/>
<rect x="585" y="238" width="120" height="4" fill="#5EEAD4"/>
<path d="M611 298 l22 24 l46 -52" fill="none" stroke="#071512" stroke-width="12" stroke-linecap="square"/>
<text x="645" y="380" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="3" fill="#D9F2E8" text-anchor="middle">VERIFIED</text>

<!-- footer strip -->
<rect x="0" y="390" width="800" height="60" fill="#050F0D"/>
<rect x="0" y="390" width="800" height="1" fill="#123430"/>
<text x="28" y="418" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="2" fill="#D9F2E8">ANDROIDSCROLL · FIELD TEST LOG</text>
<text x="28" y="436" font-family="'IBM Plex Mono',monospace" font-size="10" letter-spacing="1" fill="#8FA9A2">TESTED ON REAL HARDWARE · APK MIRROR STEP 6 OF 6</text>
<text x="772" y="428" font-family="'IBM Plex Mono',monospace" font-size="13" fill="#5EEAD4" text-anchor="end">6/6 PASS</text>
</g>
</svg>
