<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Install unknown apps permission dialog with Allow and Deny buttons, the file-manager row toggled on and the browser row toggled off, beside a security checklist panel">
<defs>
<clipPath id="clip"><rect width="800" height="450"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="800" height="450" fill="#F7FAF9"/>
<rect width="800" height="4" fill="#0A332C"/>
<rect x="0" y="446" width="800" height="4" fill="#00A88F"/>
<rect x="24" y="24" width="16" height="2" fill="#B9CCC6"/><rect x="24" y="24" width="2" height="16" fill="#B9CCC6"/>

<!-- dialog -->
<rect x="48" y="60" width="380" height="330" fill="#FFFFFF" stroke="#B9CCC6" stroke-width="2"/>
<rect x="48" y="60" width="380" height="4" fill="#0A332C"/>
<text x="74" y="98" font-family="'IBM Plex Mono',monospace" font-size="12" letter-spacing="1" fill="#10231F" font-weight="600">Install unknown apps</text>
<text x="74" y="118" font-family="'IBM Plex Mono',monospace" font-size="9.5" fill="#52635F">Allow this app to install APKs from other sources?</text>
<rect x="74" y="132" width="328" height="1" fill="#DDE8E3"/>
<!-- file manager row: ON -->
<rect x="74" y="148" width="26" height="26" fill="#006E5E"/>
<rect x="80" y="156" width="14" height="10" fill="#FFFFFF"/><rect x="80" y="153" width="7" height="4" fill="#FFFFFF"/>
<text x="112" y="160" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#10231F">Files (system manager)</text>
<text x="112" y="174" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#006E5E">the only one you need</text>
<rect x="364" y="152" width="38" height="18" fill="#00A88F"/><rect x="384" y="152" width="18" height="18" fill="#014F44"/>
<rect x="74" y="190" width="328" height="1" fill="#DDE8E3"/>
<!-- browser row: OFF -->
<rect x="74" y="202" width="26" height="26" fill="#EDF6F3" stroke="#B9CCC6"/>
<circle cx="87" cy="215" r="7" fill="none" stroke="#52635F" stroke-width="2"/>
<text x="112" y="214" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#2C4640">Chrome</text>
<text x="112" y="228" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#52635F">no — random links become APKs</text>
<rect x="364" y="206" width="38" height="18" fill="#DDE8E3"/><rect x="364" y="206" width="18" height="18" fill="#FFFFFF" stroke="#B9CCC6"/>
<rect x="74" y="244" width="328" height="1" fill="#DDE8E3"/>
<!-- buttons -->
<rect x="74" y="266" width="156" height="44" fill="#FFFFFF" stroke="#006E5E" stroke-width="2"/>
<text x="152" y="293" font-family="'IBM Plex Mono',monospace" font-size="12" fill="#006E5E" text-anchor="middle">Deny</text>
<rect x="246" y="266" width="156" height="44" fill="#006E5E"/>
<rect x="246" y="266" width="156" height="3" fill="#00A88F"/>
<text x="324" y="293" font-family="'IBM Plex Mono',monospace" font-size="12" fill="#FFFFFF" text-anchor="middle">Allow</text>
<text x="74" y="342" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#52635F">Android 8+ makes this permission per-app, not global.</text>
<text x="74" y="358" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#52635F">Turn it back off after the install — one toggle, done.</text>

<!-- checklist panel -->
<rect x="468" y="60" width="308" height="330" fill="#0A332C"/>
<rect x="468" y="60" width="308" height="4" fill="#00A88F"/>
<text x="492" y="94" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="2" fill="#5EEAD4">SAFETY CHECKLIST</text>
<rect x="492" y="104" width="260" height="1" fill="#123430"/>
<rect x="492" y="120" width="12" height="12" fill="#00A88F"/><path d="M494 126 l2.5 2.5 l4.5 -5" fill="none" stroke="#071512" stroke-width="1.6"/>
<text x="514" y="130" font-family="'IBM Plex Mono',monospace" font-size="10.5" fill="#D9F2E8">APK from official store / developer</text>
<rect x="492" y="148" width="12" height="12" fill="#00A88F"/><path d="M494 154 l2.5 2.5 l4.5 -5" fill="none" stroke="#071512" stroke-width="1.6"/>
<text x="514" y="158" font-family="'IBM Plex Mono',monospace" font-size="10.5" fill="#D9F2E8">Matched file size + checksum</text>
<rect x="492" y="176" width="12" height="12" fill="#00A88F"/><path d="M494 182 l2.5 2.5 l4.5 -5" fill="none" stroke="#071512" stroke-width="1.6"/>
<text x="514" y="186" font-family="'IBM Plex Mono',monospace" font-size="10.5" fill="#D9F2E8">Play Protect scan passed</text>
<rect x="492" y="204" width="12" height="12" fill="#00A88F"/><path d="M494 210 l2.5 2.5 l4.5 -5" fill="none" stroke="#071512" stroke-width="1.6"/>
<text x="514" y="214" font-family="'IBM Plex Mono',monospace" font-size="10.5" fill="#D9F2E8">Permission list looks sane</text>
<rect x="492" y="232" width="12" height="12" fill="#00A88F"/><path d="M494 238 l2.5 2.5 l4.5 -5" fill="none" stroke="#071512" stroke-width="1.6"/>
<text x="514" y="242" font-family="'IBM Plex Mono',monospace" font-size="10.5" fill="#D9F2E8">Toggle off again when done</text>
<rect x="492" y="266" width="260" height="1" fill="#123430"/>
<text x="492" y="292" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#8FA9A2">If an app asks for SMS + contacts + location</text>
<text x="492" y="308" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#8FA9A2">at once, stop. Deny is always safe.</text>
<rect x="492" y="326" width="242" height="36" fill="none" stroke="#123430"/>
<text x="613" y="349" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="2" fill="#5EEAD4" text-anchor="middle">5 BEFORE 1 ALLOW</text>
</g>
</svg>
