<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" aria-hidden="true" focusable="false">
  <g fill="#D9F2E8" opacity="0.18" transform="translate(4 23)">
    <!-- staff lines (faint) -->
    <line x1="20" y1="60" x2="180" y2="60" stroke="#D9F2E8" stroke-width="0.5" opacity="0.3"/>
    <line x1="20" y1="75" x2="180" y2="75" stroke="#D9F2E8" stroke-width="0.5" opacity="0.3"/>
    <line x1="20" y1="90" x2="180" y2="90" stroke="#D9F2E8" stroke-width="0.5" opacity="0.3"/>
    <line x1="20" y1="105" x2="180" y2="105" stroke="#D9F2E8" stroke-width="0.5" opacity="0.3"/>
    <line x1="20" y1="120" x2="180" y2="120" stroke="#D9F2E8" stroke-width="0.5" opacity="0.3"/>
    <!-- beamed eighth notes -->
    <ellipse cx="70" cy="105" rx="14" ry="10" transform="rotate(-20 70 105)"/>
    <ellipse cx="110" cy="90" rx="14" ry="10" transform="rotate(-20 110 90)"/>
    <line x1="84" y1="100" x2="84" y2="55" stroke="#D9F2E8" stroke-width="2.5"/>
    <line x1="124" y1="85" x2="124" y2="40" stroke="#D9F2E8" stroke-width="2.5"/>
    <line x1="84" y1="55" x2="124" y2="40" stroke="#D9F2E8" stroke-width="2.5"/>
    <!-- second beam -->
    <line x1="84" y1="62" x2="124" y2="47" stroke="#D9F2E8" stroke-width="2.5"/>
  </g>
</svg>
